<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/x-icon" href="eXit_favicon/favicon.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>eXit</title>
  <link rel="stylesheet" href="../loader.css?v=20261002-1">

<body>
  <div id="site-loader" role="status" aria-live="polite" aria-label="Carregando eXit">

      <div class="site-loader-heading"><div class="site-loader-title">LOADING...</div><div id="site-loader-detail">0%</div></div>

    <div id="dust-glow" aria-hidden="true"></div>
    <div id="edge-mask" aria-hidden="true"></div>
    <div id="focus-hint" aria-hidden="true">Clique / Pressione qualquer tecla</div>
  </main>

</html>
